<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In or Create Account — BusGo Intercity</title>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/common.css" />
</head>
<body>
  <!-- Unified Navigation Bar -->
  <header class="navbar">
    <div class="container">
      <a href="index.html" class="brand-logo">
        <span class="brand-logo-badge">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <rect x="3" y="4" width="18" height="14" rx="3"/>
            <path d="M3 11h18M7 18v2M17 18v2"/>
          </svg>
        </span>
        Bus<span class="accent">Go</span>
      </a>
      <nav id="navLinks" class="nav-links">
        <a href="index.html" class="nav-link">← Back to Home</a>
      </nav>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <h1 id="authTitle">Welcome Back</h1>
          <p id="authSubtitle">Sign in to manage bookings, lock seats, and view your digital boarding passes</p>
        </div>

        <div class="auth-tabs" role="tablist">
          <button type="button" class="auth-tab active" id="tabLogin" role="tab" aria-selected="true">Sign In</button>
          <button type="button" class="auth-tab" id="tabRegister" role="tab" aria-selected="false">Create Account</button>
        </div>

        <!-- Inline Alert Banner -->
        <div id="authAlert" class="alert alert-error hidden" role="alert"></div>

        <!-- Sign In Form -->
        <form id="loginForm" class="auth-form" novalidate>
          <div class="form-group">
            <label for="loginEmail" class="form-label">Email Address</label>
            <input type="email" id="loginEmail" class="form-control" placeholder="name@example.com" autocomplete="email" required />
            <span class="field-error-text hidden" id="loginEmailError"></span>
          </div>

          <div class="form-group">
            <label for="loginPassword" class="form-label">Password</label>
            <div class="password-input-wrap">
              <input type="password" id="loginPassword" class="form-control" placeholder="Enter your password" autocomplete="current-password" required />
              <button type="button" class="password-toggle-btn" data-password-toggle="loginPassword" aria-label="Show password" aria-pressed="false" title="Show password">
                <!-- Eye Open Icon -->
                <svg class="icon-eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <!-- Eye Off Icon -->
                <svg class="icon-eye-off hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
            <span class="field-error-text hidden" id="loginPasswordError"></span>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg" id="loginSubmitBtn">
            Sign In to BusGo
          </button>
        </form>

        <!-- Create Account Form -->
        <form id="registerForm" class="auth-form hidden" novalidate>
          <div class="form-group">
            <label for="regName" class="form-label">Full Name</label>
            <input type="text" id="regName" class="form-control" placeholder="e.g., Karthik Sundaram" autocomplete="name" required minlength="2" />
            <span class="field-error-text hidden" id="regNameError"></span>
          </div>

          <div class="form-group">
            <label for="regEmail" class="form-label">Email Address</label>
            <input type="email" id="regEmail" class="form-control" placeholder="karthik@example.com" autocomplete="email" required />
            <span class="field-error-text hidden" id="regEmailError"></span>
          </div>

          <div class="form-group">
            <label for="regPhone" class="form-label">Mobile Number (10 digits)</label>
            <input type="tel" id="regPhone" class="form-control" placeholder="9876543210" autocomplete="tel" required />
            <span class="field-error-text hidden" id="regPhoneError"></span>
          </div>

          <div class="form-group">
            <label for="regPassword" class="form-label">Create Password</label>
            <div class="password-input-wrap">
              <input type="password" id="regPassword" class="form-control" placeholder="Minimum 6 characters" autocomplete="new-password" required minlength="6" />
              <button type="button" class="password-toggle-btn" data-password-toggle="regPassword" aria-label="Show password" aria-pressed="false" title="Show password">
                <svg class="icon-eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg class="icon-eye-off hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
            <span class="field-error-text hidden" id="regPasswordError"></span>
          </div>

          <div class="form-group">
            <label for="regConfirmPassword" class="form-label">Confirm Password</label>
            <div class="password-input-wrap">
              <input type="password" id="regConfirmPassword" class="form-control" placeholder="Re-enter your password" autocomplete="new-password" required minlength="6" />
              <button type="button" class="password-toggle-btn" data-password-toggle="regConfirmPassword" aria-label="Show password" aria-pressed="false" title="Show password">
                <svg class="icon-eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg class="icon-eye-off hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
            <span class="field-error-text hidden" id="regConfirmPasswordError"></span>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg" id="regSubmitBtn">
            Create Account
          </button>
        </form>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
