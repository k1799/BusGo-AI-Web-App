<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Operations Sign In — BusGo</title>
  <link rel="stylesheet" href="assets/css/variables.css" />
  <link rel="stylesheet" href="assets/css/common.css" />
  <link rel="stylesheet" href="assets/css/admin.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    .admin-login-body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0a1726 0%, #10243a 60%, #173252 100%);
      padding: 1.5rem;
      font-family: var(--font-sans, 'Inter', sans-serif);
      color: #e2e8f0;
    }
    .admin-login-card {
      width: 100%;
      max-width: 440px;
      background: #112237;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5);
      padding: 2.25rem;
    }
    .admin-login-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .admin-login-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }
    .admin-login-title {
      font-size: 1.6rem;
      font-weight: 800;
      color: #ffffff;
      margin: 0 0 0.5rem;
    }
    .admin-login-subtitle {
      font-size: 0.88rem;
      color: #94a3b8;
      margin: 0;
      line-height: 1.4;
    }
    .admin-form-group {
      margin-bottom: 1.25rem;
    }
    .admin-form-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 0.4rem;
      letter-spacing: 0.02em;
    }
    .admin-input-wrap {
      position: relative;
    }
    .admin-input {
      width: 100%;
      background: #0d1a2d;
      border: 1px solid #1e3a5f;
      border-radius: 8px;
      color: #ffffff;
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      box-sizing: border-box;
    }
    .admin-input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
    }
    .admin-input.is-invalid {
      border-color: #ef4444;
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.25);
    }
    .admin-toggle-pwd {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .admin-toggle-pwd:hover {
      color: #ffffff;
    }
    .admin-submit-btn {
      width: 100%;
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 0.85rem;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.15s ease;
      margin-top: 0.5rem;
    }
    .admin-submit-btn:hover {
      background: #1d4ed8;
    }
    .admin-submit-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    .admin-alert {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
      line-height: 1.4;
    }
    .admin-footer-link {
      margin-top: 1.75rem;
      text-align: center;
    }
    .admin-footer-link a {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.85rem;
      transition: color 0.15s ease;
    }
    .admin-footer-link a:hover {
      color: #ffffff;
    }
    .field-error-text {
      color: #fca5a5;
      font-size: 0.78rem;
      margin-top: 0.35rem;
      display: block;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body class="admin-login-body">
  <div class="admin-login-card">
    <div class="admin-login-header">
      <div class="admin-login-badge">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        Restricted Operator Area
      </div>
      <h1 class="admin-login-title">BusGo Operations</h1>
      <p class="admin-login-subtitle">Sign in with authorized administrator credentials to manage fleet, schedules, and dispatches</p>
    </div>

    <!-- Alert Banner -->
    <div id="adminAlert" class="admin-alert hidden" role="alert"></div>

    <form id="adminLoginForm" novalidate>
      <div class="admin-form-group">
        <label for="adminEmail" class="admin-form-label">Operator Email</label>
        <div class="admin-input-wrap">
          <input type="email" id="adminEmail" class="admin-input" placeholder="operator@busgo.com" autocomplete="email" required />
        </div>
        <span class="field-error-text hidden" id="adminEmailError"></span>
      </div>

      <div class="admin-form-group">
        <label for="adminPassword" class="admin-form-label">Security Password</label>
        <div class="admin-input-wrap">
          <input type="password" id="adminPassword" class="admin-input" placeholder="Enter administrator password" autocomplete="current-password" required />
          <button type="button" class="admin-toggle-pwd" id="togglePasswordBtn" aria-label="Show password" title="Show password">
            <svg id="eyeOpenIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg id="eyeOffIcon" class="hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
        <span class="field-error-text hidden" id="adminPasswordError"></span>
      </div>

      <button type="submit" class="admin-submit-btn" id="adminLoginBtn">
        Sign In to Operations Console
      </button>
    </form>

    <div class="admin-footer-link">
      <a href="index.html">← Return to Passenger Travel Portal</a>
    </div>
  </div>

  <script type="module">
    import { AuthService } from './assets/js/auth.js';
    import { ApiClient } from './assets/js/api.js';

    function sanitizeRedirectUrl(url, defaultUrl = 'admin.html') {
      if (!url || typeof url !== 'string') return defaultUrl;
      const trimmed = url.trim();
      // Block open redirects (protocols, protocol-relative //, javascript:, data:)
      if (trimmed.startsWith('//') || /^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(trimmed)) {
        return defaultUrl;
      }
      // Must be an admin-related destination or relative file
      return trimmed;
    }

    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('adminLoginForm');
      const emailInput = document.getElementById('adminEmail');
      const passwordInput = document.getElementById('adminPassword');
      const submitBtn = document.getElementById('adminLoginBtn');
      const alertEl = document.getElementById('adminAlert');
      const emailError = document.getElementById('adminEmailError');
      const passwordError = document.getElementById('adminPasswordError');
      const togglePwdBtn = document.getElementById('togglePasswordBtn');
      const eyeOpen = document.getElementById('eyeOpenIcon');
      const eyeOff = document.getElementById('eyeOffIcon');

      const urlParams = new URLSearchParams(window.location.search);
      const rawRedirect = urlParams.get('redirect') || urlParams.get('returnUrl') || 'admin.html';
      const redirectUrl = sanitizeRedirectUrl(rawRedirect, 'admin.html');

      // Toggle password visibility
      togglePwdBtn.addEventListener('click', () => {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        eyeOpen.classList.toggle('hidden', isPassword);
        eyeOff.classList.toggle('hidden', !isPassword);
        togglePwdBtn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
      });

      function clearErrors() {
        alertEl.classList.add('hidden');
        alertEl.textContent = '';
        emailInput.classList.remove('is-invalid');
        passwordInput.classList.remove('is-invalid');
        emailError.classList.add('hidden');
        passwordError.classList.add('hidden');
      }

      [emailInput, passwordInput].forEach(inp => {
        inp.addEventListener('input', clearErrors);
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearErrors();

        const email = emailInput.value.trim();
        const password = passwordInput.value;
        let hasError = false;

        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          emailInput.classList.add('is-invalid');
          emailError.textContent = 'Please enter a valid administrator email address.';
          emailError.classList.remove('hidden');
          hasError = true;
        }

        if (!password) {
          passwordInput.classList.add('is-invalid');
          passwordError.textContent = 'Please enter your administrator password.';
          passwordError.classList.remove('hidden');
          hasError = true;
        }

        if (hasError) return;

        try {
          submitBtn.disabled = true;
          submitBtn.textContent = 'Verifying credentials...';

          const user = await AuthService.login(email, password);

          // Strictly enforce admin role check
          const role = user && user.role;
          const isAdmin = role === 'ROLE_ADMIN' || role === 'ADMIN';

          if (!isAdmin) {
            // Customer attempted to use the admin portal
            AuthService.logout(null);
            alertEl.textContent = 'Access Denied: This operations portal is strictly restricted to administrator accounts.';
            alertEl.classList.remove('hidden');
            return;
          }

          // Ensure session is synchronized in root ApiClient keys too for cross-page compatibility
          const token = ApiClient.getToken();
          if (token) {
            localStorage.setItem('busgo_jwt_token', token);
            localStorage.setItem('busgo_token', token);
          }

          window.location.href = redirectUrl;
        } catch (err) {
          alertEl.textContent = err.message || 'Invalid administrator email or password.';
          alertEl.classList.remove('hidden');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In to Operations Console';
        }
      });
    });
  </script>
</body>
</html>
