# ==============================================================================
# BusGo Spring Boot Application Configuration
# ==============================================================================

server.port=${PORT:8080}
spring.application.name=busgo-backend

# Datasource Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/busgo_db}
spring.datasource.username=${DB_USERNAME:busgo_app}
spring.datasource.password=${DB_PASSWORD:busgo_secure_pass_2026}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Business & Timezone Settings
busgo.app.timezone=${APP_TIMEZONE:Asia/Kolkata}
busgo.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080}

# JWT Authentication
busgo.jwt.secret=${JWT_SECRET:BusGo_Production_Grade_Secret_Key_For_Jwt_Token_Validation_2026_Secure}
busgo.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Seat Hold Expiry in Seconds (Default: 10 minutes = 600s)
busgo.booking.hold-duration-seconds=600

# Payment Provider Configuration
busgo.payment.mode=${PAYMENT_PROVIDER_MODE:DEMO}
busgo.payment.key=${PAYMENT_PROVIDER_KEY:rzp_test_placeholder_key}
busgo.payment.secret=${PAYMENT_PROVIDER_SECRET:rzp_test_placeholder_secret}
busgo.payment.currency=INR

# WhatsApp Provider Configuration
busgo.whatsapp.mode=${WHATSAPP_PROVIDER_MODE:MOCK}
busgo.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
busgo.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
busgo.whatsapp.business-account-id=${WHATSAPP_BUSINESS_ACCOUNT_ID:}
busgo.whatsapp.lead-minutes=${WHATSAPP_NOTIFICATION_LEAD_MINUTES:10}

# Actuator / Health Endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
