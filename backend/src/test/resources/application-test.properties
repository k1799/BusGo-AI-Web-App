# Test application properties using standard H2 in-memory database
spring.application.name=busgo-backend-test
spring.datasource.url=jdbc:h2:mem:busgo_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.flyway.enabled=false

busgo.app.timezone=Asia/Kolkata
busgo.jwt.secret=Test_Secret_Key_For_Unit_And_Integration_Testing_Min_256_Bits_Secure_Key
busgo.jwt.expiration-ms=3600000
busgo.booking.hold-duration-seconds=600

busgo.payment.mode=DEMO
busgo.payment.key=rzp_test_dummy
busgo.payment.secret=rzp_secret_dummy

busgo.whatsapp.mode=MOCK
busgo.whatsapp.lead-minutes=10
